{% extends 'base.html' %}
{% block title %}New classroom — VRC Learn{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">Create a classroom</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-dark">Create</button>
    </form>
  </div>
</div>
{% endblock %}
